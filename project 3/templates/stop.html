<!DOCTYPE html>
<html>
<head>
    <title>Commuter Rail Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>

    <style>
        body { background: #f5f7fb; }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <h2>🚆 Commuter Rail Finder (MBTA)</h2>

    <form method="POST" class="mb-3">
        <input name="place" class="form-control mb-2" placeholder="Enter location" required>
        <button class="btn btn-primary">Search</button>
    </form>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if stop %}

    <div class="card p-3 mb-3">
        <h5>{{ place }}</h5>

        <p><b>Nearest Commuter Rail Station:</b> {{ stop.name }}</p>

        <p>
            <b>Wheelchair Accessible:</b>
            {{ "Yes" if stop.wheelchair else "No" }}
        </p>
    </div>

    <div id="map"></div>

    <script>
        mapboxgl.accessToken = "{{ mapbox_token }}";

        const user = [{{ lng }}, {{ lat }}];
        const stop = [{{ stop.lng }}, {{ stop.lat }}];

        const map = new mapboxgl.Map({
            container: "map",
            style: "mapbox://styles/mapbox/streets-v12"
        });

        new mapboxgl.Marker({ color: "blue" })
            .setLngLat(user)
            .setPopup(new mapboxgl.Popup().setText("Search Location"))
            .addTo(map);

        new mapboxgl.Marker({ color: "red" })
            .setLngLat(stop)
            .setPopup(new mapboxgl.Popup().setText(stop.name))
            .addTo(map);

        const bounds = new mapboxgl.LngLatBounds();
        bounds.extend(user);
        bounds.extend(stop);

        map.fitBounds(bounds, { padding: 80 });
    </script>

    {% endif %}

</div>

</body>
</html>
